---
- name: System Update Management
  hosts: homelab
  become: true # Requires administrator privileges (sudo)

  tasks:

    # STEP 1: Refresh package list (apt update)
    - name: Update local APT cache
      apt:
        update_cache: true
        cache_valid_time: 3600 # Cache will not be re-downloaded if less than an hour has passed since the last check
      tags: update

    # STEP 2: Actual installation of updates (apt upgrade --dist-upgrade)
    - name: Safe upgrade of all packages to the latest version
      apt:
        upgrade: dist # "dist" also handles smart addition/removal of dependencies like in enterprise Ubuntu
        autoremove: true # Automatically remove old unnecessary packages (orphan packages)
      register: update_result
      tags: upgrade

    # STEP 3: Check if the system requires a reboot
    - name: Verify whether the system requires a reboot after update
      stat:
        path: /var/run/reboot-required
      register: reboot_file

    # STEP 4: Controlled reboot (only if necessary)
    - name: Restart server (only if kernel or core services require a reboot)
      reboot:
        msg: "Ansible automated restart: System has been successfully updated."
        connect_timeout: 5
        reboot_timeout: 300 # Wait maximum 5 minutes for the server to come back online
        pre_reboot_delay: 0
        post_reboot_delay: 30 # Wait 30 seconds after startup before running other services
      when: reboot_file.stat.exists # Runs ONLY if reboot_file exists

    # STEP 5: Final output for the operator
    - name: Print update status summary
      debug:
        msg: >
          Update completed successfully.
          Packages were updated: {{ update_result.changed }}.
          Server was rebooted: {{ reboot_file.stat.exists }}.
