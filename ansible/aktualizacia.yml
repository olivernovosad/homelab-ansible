---
- name: Správa aktualizácií systému
  hosts: homelab
  become: true # Vyžaduje administrátorské práva (sudo)
  
  tasks:
    
    # 1. KROK: Obnovenie zoznamu balíčkov (apt update)
    - name: Aktualizácia lokálnej APT cache
      apt:
        update_cache: true
        cache_valid_time: 3600 # Cache sa nebude sťahovať znova, ak od poslednej kontroly ubehla menej ako hodina
      tags: update

    # 2. KROK: Samotná inštalácia aktualizácií (apt upgrade --dist-upgrade)
    - name: Bezpečná aktualizácia všetkých balíčkov na najnovšiu verziu
      apt:
        upgrade: dist # "dist" rieši aj inteligentné pridávanie/odoberanie závislostí ako v korporátnom Ubuntu
        autoremove: true # Automaticky vymaže staré nepotrebné balíčky (tzv. orphan packages)
      register: vysledok_aktualizacie
      tags: upgrade

    # 3. KROK: Kontrola, či systém vyžaduje reštart
    - name: Overenie, či systém po aktualizácii vyžaduje reštart
      stat:
        path: /var/run/reboot-required
      register: subor_restartu

    # 4. KROK: Riadený reštart (iba ak je nutný)
    - name: Reštartovanie servera (iba ak kernel alebo kľúčové služby vyžadujú reštart)
      reboot:
        msg: "Ansible automatizovaný reštart: Systém bol úspešne aktualizovaný."
        connect_timeout: 5
        reboot_timeout: 300 # Počká maximálne 5 minút, kým server znova nabehne
        pre_reboot_delay: 0
        post_reboot_delay: 30 # Po nabehnutí počká 30 sekúnd, kým pustí ďalšie služby
      when: subor_restartu.stat.exists # Spustí sa LEN vtedy, ak subor_restartu existuje

    # 5. KROK: Finálny výstup pre operátora
    - name: Výpis stavu aktualizácie
      debug:
        msg: >
          Aktualizácia prebehla úspešne. 
          Balíčky boli aktualizované: {{ vysledok_aktualizacie.changed }}. 
          Server bol reštartovaný: {{ subor_restartu.stat.exists }}.
