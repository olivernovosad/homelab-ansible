---
- name: Complete homelab management, hardening and deployment
  hosts: "{{ target_hosts | default('staging') }}"
  become: true

  roles:
    - bootstrap        # OS hardening, UFW, sysctl, Docker Engine
    - system           # Watchtower, CrowdSec, Autoheal, Kopia backups
    - connection       # Nginx Proxy Manager, Cloudflare Tunnel
    - vaultwarden      # Password manager
    - nextcloud        # Nextcloud AIO
    - media            # Jellyfin, torrents, Gluetun VPN, *arr stack
    - monitoring       # Grafana, Prometheus, Node Exporter, cAdvisor
    - foundry          # Foundry VTT
