---
- name: Complete homelab management, hardening and deployment
  hosts: "{{ target_hosts | default('staging') }}"
  become: true

  roles:
    - role: bootstrap        # OS hardening, UFW, sysctl, Docker Engine
      tags: bootstrap
    - role: system           # CrowdSec, automatic OS updates
      tags: system
    - role: connection       # Nginx Proxy Manager, Cloudflare Tunnel
      tags: connection
    - role: vaultwarden      # Password manager
      tags: vaultwarden
    - role: nextcloud        # Nextcloud (Postgres, Redis, cron, Collabora)
      tags: nextcloud
    - role: media            # Jellyfin, torrents, Gluetun VPN, *arr stack
      tags: media
    - role: monitoring       # Grafana, Prometheus, Node Exporter, cAdvisor
      tags: monitoring
    - role: foundry          # Foundry VTT
      tags: foundry
    - role: backup           # Kopia, nightly script, Backblaze B2
      tags: backup
