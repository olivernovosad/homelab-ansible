---
# ===========================================================================
# 1. BASE PACKAGES & QEMU GUEST AGENT
# ===========================================================================
- name: Update apt cache and install base system packages
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure QEMU Guest Agent is running
  ansible.builtin.systemd:
    name: qemu-guest-agent
    state: started
    enabled: true
  when: ansible_facts['virtualization_role'] == 'guest'

# ===========================================================================
# 2. REMOVE OLD / UNOFFICIAL DOCKER PACKAGES
# ===========================================================================
# IMPORTANT: 'containerd' and 'runc' must NEVER be in this list!
# Current Docker CE uses 'containerd.io'. If they show up here, APT will break
# dependencies and take down the running Docker daemon along with all containers.
- name: Ensure old unofficial Ubuntu Docker packages are absent
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-doc
      - docker-compose
      - docker-compose-v2
      - podman-docker
    state: absent
    purge: false

# ===========================================================================
# 3. DOCKER CE & OFFICIAL REPOSITORY
# ===========================================================================
- name: Install dependencies for the Docker APT repository
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present

- name: Create directory for APT keyrings
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download official Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
    force: false

- name: Add Docker CE repository to APT
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable"
    state: present
    filename: docker

- name: Install official Docker CE packages
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present

- name: Ensure Docker service is running and enabled on boot
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: "Add user to docker group: {{ ansible_user }}"
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true

# ===========================================================================
# 4. SSH HARDENING
# ===========================================================================
- name: Apply secure SSH configuration (drop-in file)
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/99-hardening.conf
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      MaxAuthTries 3
      X11Forwarding no
      # Kept enabled intentionally: used for SSH tunneling to internal-only
      # admin UIs (e.g. NPM on 127.0.0.1:81) without exposing them on the LAN.
      AllowTcpForwarding yes
    mode: '0600'
  notify: Restart SSH

# ===========================================================================
# 5. UFW FIREWALL CONFIGURATION
# ===========================================================================
- name: Set default UFW policy (deny incoming)
  community.general.ufw:
    policy: deny
    direction: incoming

- name: Allow SSH from managed networks (LAN + Libvirt KVM staging)
  community.general.ufw:
    rule: allow
    src: "{{ item }}"
    port: '22'
    proto: tcp
  loop:
    - "{{ lan_subnet }}"
    - "192.168.122.0/24" # Libvirt subnet (staging)

- name: Allow HTTP/HTTPS for publicly-routed web services
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - '80'
    - '443'

# Intentionally not port-scoped: Docker manipulates iptables directly for its
# own NAT/container-to-container traffic, and UFW cannot selectively filter
# ports on an already-Docker-managed bridge without ufw-docker or a custom
# after.rules setup. Trusting the whole docker_subnet (172.16.0.0/12) is the
# accepted trade-off here — every container-exposed port is still individually
# bound to 127.0.0.1 or explicit ports at the docker_container level, so this
# rule only affects host<->container traffic, not what's reachable from the WAN.
- name: Allow communication from Docker networks to host
  community.general.ufw:
    rule: allow
    src: "{{ docker_subnet }}"

- name: Enable UFW firewall
  community.general.ufw:
    state: enabled

# ===========================================================================
# 6. KERNEL HARDENING (SYSCTL)
# ===========================================================================
- name: Configure sysctl for network security and Docker
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    reload: true
  loop:
    - { key: 'net.ipv4.tcp_syncookies', value: '1' }
    - { key: 'net.ipv4.conf.all.accept_redirects', value: '0' }
    - { key: 'net.ipv4.conf.all.send_redirects', value: '0' }
    - { key: 'net.ipv4.ip_forward', value: '1' }
