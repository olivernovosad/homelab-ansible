---
# ===========================================================================
# DIRECTORY, CONFIGURATION, AND DOCKER NETWORK PREPARATION
# ===========================================================================
- name: Create Prometheus directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "65534"
    group: "65534"
    mode: '0755'
  loop:
    - /opt/docker/app-data/prometheus
    - /opt/docker/app-data/prometheus/data

- name: Create Grafana directory
  ansible.builtin.file:
    path: "{{ appdata_path }}/grafana"
    state: directory
    owner: "472"
    group: "472"
    mode: '0755'

- name: Create Node Exporter textfile collector directory
  ansible.builtin.file:
    path: "{{ kopia_textfile_metrics_dir }}"
    state: directory
    mode: '0755'
  # Written to by the backup role's kopia-snapshot.sh and by restore_verify; read here by
  # node-exporter so backup success/failure shows up as a normal Prometheus
  # metric (kopia_backup_last_run_*) next to everything else in Grafana.

- name: Create default prometheus.yml file (if it does not exist)
  ansible.builtin.copy:
    dest: "{{ appdata_path }}/prometheus/prometheus.yml"
    content: |
      global:
        scrape_interval: 15s
        evaluation_interval: 15s

      scrape_configs:
        - job_name: 'prometheus'
          static_configs:
            - targets: ['localhost:9090']

        - job_name: 'node-exporter'
          static_configs:
            - targets: ['node-exporter:9100']

        - job_name: 'cadvisor'
          static_configs:
            - targets: ['cadvisor:8080']
    force: false
    mode: '0644'

- name: Ensure Docker network exists
  community.docker.docker_network:
    name: monitoring
    state: present

# ===========================================================================
# METRICS COLLECTION - Prometheus
# ===========================================================================
- name: Deploy Prometheus container
  community.docker.docker_container:
    name: prometheus
    image: prom/prometheus:latest
    state: started
    restart_policy: unless-stopped
    init: true
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    volumes:
      - "{{ appdata_path }}/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml"
      - "{{ appdata_path }}/prometheus/data:/prometheus"
    networks:
      - name: monitoring

# ===========================================================================
# DASHBOARDS & VISUALIZATION - Grafana
# ===========================================================================
- name: Deploy Grafana container
  community.docker.docker_container:
    name: grafana
    image: grafana/grafana:latest
    state: started
    restart_policy: unless-stopped
    init: true
    published_ports:
      - "127.0.0.1:3333:3000"
    volumes:
      - "{{ appdata_path }}/grafana:/var/lib/grafana"
    networks:
      - name: monitoring

# ===========================================================================
# HOST METRICS - Node Exporter
# ===========================================================================
- name: Deploy Node Exporter container
  community.docker.docker_container:
    name: node-exporter
    image: prom/node-exporter:latest
    state: started
    restart_policy: unless-stopped
    init: true
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)'
      - '--collector.textfile.directory=/textfile_collector'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - "{{ kopia_textfile_metrics_dir }}:/textfile_collector:ro"
    networks:
      - name: monitoring

# ===========================================================================
# CONTAINER METRICS - cAdvisor
# ===========================================================================
- name: Deploy cAdvisor container
  community.docker.docker_container:
    name: cadvisor
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    state: started
    restart_policy: unless-stopped
    init: true
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - name: monitoring
