---
# ===========================================================================
# 1. PRÍPRAVA ADRESÁROV, KONFIGURÁCIE A DOCKER SIETE
# ===========================================================================
- name: Vytvor adresár pre Prometheus
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "65534"
    group: "65534"
    mode: '0755'
  loop:
    - /opt/docker/app-data/prometheus
    - /opt/docker/app-data/prometheus/data

- name: Vytvor adresár pre Grafana
  ansible.builtin.file:
    path: "{{ appdata_path }}/grafana"
    state: directory
    owner: "472"
    group: "472"
    mode: '0755'

- name: Vytvor základný prometheus.yml súbor (ak neexistuje)
  ansible.builtin.copy:
    dest: "{{ appdata_path }}/prometheus/prometheus.yml"
    content: |
      global:
        scrape_interval: 15s
        evaluation_interval: 15s

      scrape_configs:
        - job_name: 'prometheus'
          static_configs:
            - targets: ['localhost:9090']

        - job_name: 'node-exporter'
          static_configs:
            - targets: ['node-exporter:9100']

        - job_name: 'cadvisor'
          static_configs:
            - targets: ['cadvisor:8080']
    force: false
    mode: '0644'

- name: Uisti sa, že Docker sieť existuje
  community.docker.docker_network:
    name: monitoring
    state: present

# ===========================================================================
# 2. METRICS COLLECTION - Prometheus
# ===========================================================================
- name: Spusti Prometheus kontajner
  community.docker.docker_container:
    name: prometheus
    image: prom/prometheus:latest
    state: started
    restart_policy: unless-stopped
    init: true
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    volumes:
      - "{{ appdata_path }}/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml"
      - "{{ appdata_path }}/prometheus/data:/prometheus"
    networks:
      - name: monitoring

# ===========================================================================
# 3. DASHBOARDS & VISUALIZATION - Grafana
# ===========================================================================
- name: Spusti Grafana kontajner
  community.docker.docker_container:
    name: grafana
    image: grafana/grafana:latest
    state: started
    restart_policy: unless-stopped
    init: true
    published_ports:
      - "127.0.0.1:3333:3000"
    volumes:
      - "{{ appdata_path }}/grafana:/var/lib/grafana"
    networks:
      - name: monitoring

# ===========================================================================
# 4. HOST METRICS - Node Exporter
# ===========================================================================
- name: Spusti Node Exporter kontajner
  community.docker.docker_container:
    name: node-exporter
    image: prom/node-exporter:latest
    state: started
    restart_policy: unless-stopped
    init: true
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - name: monitoring

# ===========================================================================
# 5. CONTAINER METRICS - cAdvisor
# ===========================================================================
- name: Spusti cAdvisor kontajner
  community.docker.docker_container:
    name: cadvisor
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    state: started
    restart_policy: unless-stopped
    init: true
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - name: monitoring
