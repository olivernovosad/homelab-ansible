---
# ===========================================================================
# 1. PRÍPRAVA ADRESÁROV NA DISKU
# ===========================================================================
- name: Vytvor potrebné adresáre pre systémové aplikácie
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ appdata_path }}/crowdsec/config"
    - "{{ appdata_path }}/crowdsec/data"
    - "{{ appdata_path }}/kopia/config"
    - "{{ appdata_path }}/kopia/cache"
    - "{{ storage_hdd_path | default('/mnt/hdd8T') }}/backups/kopia"
# ===========================================================================
# 2. CROWDSEC - Digitálny vyhadzovač
# ===========================================================================
- name: Spusti CrowdSec kontajner
  community.docker.docker_container:
    name: crowdsec
    image: crowdsecurity/crowdsec:latest
    state: started
    restart_policy: unless-stopped
    env:
      COLLECTIONS: "crowdsecurity/nginx crowdsecurity/http-cve"
    volumes:
      - "{{ appdata_path }}/crowdsec/config:/etc/crowdsec"
      - "{{ appdata_path }}/crowdsec/data:/var/lib/crowdsec/data"
      - /var/log:/var/log:ro
      - "{{ appdata_path }}/npm/logs:/logs/npm:ro"

# ===========================================================================
# 3. WATCHTOWER - Automatické aktualizácie kontajnerov
# ===========================================================================
- name: Spusti Watchtower kontajner
  community.docker.docker_container:
    name: watchtower
    image: containrrr/watchtower:latest
    state: started
    restart_policy: unless-stopped
    env:
      WATCHTOWER_CLEANUP: "true"
      DOCKER_API_VERSION: "1.52"
      WATCHTOWER_STARTUP_DELAY: "0"
      TZ: "{{ timezone }}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

# ===========================================================================
# 4. KOPIA - Zálohovací server
# ===========================================================================
- name: Spusti Kopia Backup Server kontajner
  community.docker.docker_container:
    name: kopia
    image: kopia/kopia:latest
    hostname: gaia-server
    user: "0:0"
    state: started
    restart_policy: unless-stopped
    published_ports:
      - "127.0.0.1:51515:51515"
    env:
      KOPIA_PASSWORD: "{{ vault_kopia_password }}"
    entrypoint: ["/bin/sh", "-c"]
   # Insecure je akceptovatelne kvoli lokalnemu behu. Nieje vystavene internetu a teda nema cert
    command: >
      "exec kopia server start --insecure --address=0.0.0.0:51515 --server-username=admin --server-password=$KOPIA_PASSWORD"
    volumes:
      - "{{ appdata_path }}:/app-data:ro"
      - /opt/docker/compose-stacks:/stacks:ro
      - "{{ storage_hdd_path | default('/mnt/hdd8T') }}/backups/kopia:/repository"
      - "{{ storage_ssd_path | default('/mnt/ssd') }}/nextcloud-data:/nextcloud-data:ro"
      - "{{ appdata_path }}/kopia/config:/app/config"
      - "{{ appdata_path }}/kopia/cache:/app/cache"
# ===========================================================================
# AUTOMATICKÁ ÚDRŽBA A AKTUALIZÁCIE SYSTEMU
# ===========================================================================
- name: Nainštaluj balíčky pre automatické aktualizácie
  ansible.builtin.apt:
    name:
      - unattended-upgrades
      - update-notifier-common
      - fwupd
    state: present
    update_cache: true

- name: Nastav automatický reštart pre unattended-upgrades
  ansible.builtin.lineinfile:
    path: /etc/apt/apt.conf.d/50unattended-upgrades
    regexp: '^//?\s*Unattended-Upgrade::Automatic-Reboot '
    line: 'Unattended-Upgrade::Automatic-Reboot "true";'

- name: Nastav čas automatického reštartu na 04:00
  ansible.builtin.lineinfile:
    path: /etc/apt/apt.conf.d/50unattended-upgrades
    regexp: '^//?\s*Unattended-Upgrade::Automatic-Reboot-Time '
    line: 'Unattended-Upgrade::Automatic-Reboot-Time "04:00";'
