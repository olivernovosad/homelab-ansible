---
# ===========================================================================
# File prep for apps and docker proxy for security of Watchtower and Autoheal
# ===========================================================================
- name: Create directories for apps
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ appdata_path }}/crowdsec/config"
    - "{{ appdata_path }}/crowdsec/data"
    - "{{ appdata_path }}/kopia/config"
    - "{{ appdata_path }}/kopia/cache"
    - "{{ storage_hdd_path | default('/mnt/hdd8T') }}/backups/kopia"
    - "/opt/docker/compose-stacks"

- name: Ensure monitoring network exists
  community.docker.docker_network:
    name: monitoring
    state: present

- name: Deploy Docker Socket Proxy container
  community.docker.docker_container:
    name: docker-proxy
    image: tecnativa/docker-socket-proxy:latest
    state: started
    restart_policy: unless-stopped
    env:
      POST: "0"
      BUILD: "0"
      EXEC: "0"
      DELETE: "0"
      CONTAINERS: "1"
      IMAGES: "1"
      INFO: "1"
      NETWORKS: "1"
      SERVICES: "1"
      TASKS: "1"
      VOLUMES: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - name: monitoring

# ===========================================================================
# CROWDSEC - Digital bouncer
# ===========================================================================
- name: Deploy Crowdsec container
  community.docker.docker_container:
    name: crowdsec
    image: crowdsecurity/crowdsec:latest
    state: started
    restart_policy: unless-stopped
    env:
      COLLECTIONS: "crowdsecurity/nginx crowdsecurity/http-cve"
    volumes:
      - "{{ appdata_path }}/crowdsec/config:/etc/crowdsec"
      - "{{ appdata_path }}/crowdsec/data:/var/lib/crowdsec/data"
      - /var/log:/var/log:ro
      - "{{ appdata_path }}/npm/logs:/logs/npm:ro"

# ===========================================================================
# WATCHTOWER - Auto update of containers
# ===========================================================================
- name: Deploy Watchtower container
  community.docker.docker_container:
    name: watchtower
    image: containrrr/watchtower:latest
    state: started
    restart_policy: unless-stopped
    env:
      DOCKER_HOST: "tcp://docker-proxy:2375"
      WATCHTOWER_CLEANUP: "true"
      DOCKER_API_VERSION: "1.52"
      WATCHTOWER_STARTUP_DELAY: "0"
      TZ: "{{ timezone }}"
    networks:
      - name: monitoring

# ===========================================================================
# KOPIA - Backup server
# ===========================================================================
- name: Deploy Kopia Backup Server container
  community.docker.docker_container:
    name: kopia
    image: kopia/kopia:latest
    hostname: gaia-server
    # Runs as root (0:0) intentionally: this container mounts appdata for every
    # service on the host read-only for backup purposes, and those directories
    # are owned by different UIDs per service (33 for Nextcloud, 65534 for
    # Prometheus, 1000 for most *arr apps, etc). Root avoids maintaining a
    # per-service permission matrix just to read files. Volumes are :ro except
    # the actual backup repository target.
    user: "0:0"
    state: started
    restart_policy: unless-stopped
    published_ports:
      - "127.0.0.1:51515:51515"
    env:
      KOPIA_PASSWORD: "{{ vault_kopia_password }}"
    entrypoint: ["/bin/sh", "-c"]
    # Insecure flag is acceptable here: the API is bound to 127.0.0.1 only on
    # the host (see published_ports above), never reachable from the LAN or WAN.
    command: >
      "exec kopia server start --insecure --address=0.0.0.0:51515 --server-username=admin --server-password=$KOPIA_PASSWORD"
    volumes:
      - "{{ appdata_path }}:/app-data:ro"
      - /opt/docker/compose-stacks:/stacks:ro
      - "{{ storage_hdd_path | default('/mnt/hdd8T') }}/backups/kopia:/repository"
      - "/var/lib/docker/volumes/nextcloud_nextcloud_data/_data:/nextcloud-data:ro"
      - "{{ nextcloud_dir | default('/opt/nextcloud') }}/db-dumps:/nextcloud-db-dump:ro"
      - "{{ appdata_path }}/kopia/config:/app/config"
      - "{{ appdata_path }}/kopia/cache:/app/cache"

# ===========================================================================
# KOPIA - Automatic initialization of repositories, policies and snapshot sources
# This substitues manual setup in web UI.
# ===========================================================================

- name: Wait until Kopia runs
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 51515
    timeout: 30

- name: Check if repository is connected
  ansible.builtin.command:
    cmd: docker exec kopia kopia repository status
  register: kopia_repo_status
  changed_when: false
  failed_when: false

- name: Connect to the existing repository (if it is present on the disc, but the client is not connected)
  ansible.builtin.command:
    cmd: docker exec kopia kopia repository connect filesystem --path=/repository
  when: kopia_repo_status.rc != 0
  register: kopia_connect
  changed_when: kopia_connect.rc == 0
  failed_when: false

- name: Create new repository (if it does not exist at all - initial bootstrap)
  ansible.builtin.command:
    cmd: docker exec kopia kopia repository create filesystem --path=/repository
  when: kopia_repo_status.rc != 0 and kopia_connect.rc != 0
  changed_when: true

- name: Set global retention policy
  ansible.builtin.command:
    cmd: >
      docker exec kopia kopia policy set --global
      --keep-latest=3 --keep-hourly=3 --keep-daily=7
      --keep-weekly=4 --keep-monthly=4 --keep-annual=1
      --compression=zstd
  changed_when: false

- name: Create and set a schedule for each snapshot source
  ansible.builtin.command:
    cmd: >
      docker exec kopia kopia policy set {{ item }} --snapshot-time=02:00
  loop:
    - /app-data
    - /nextcloud-data
    - /nextcloud-db-dump
    - /stacks
  changed_when: false

- name: Check if snapshot sources are already registered
  ansible.builtin.command:
    cmd: docker exec kopia kopia snapshot list --all
  register: kopia_existing_snapshots
  changed_when: false

- name: Deploy initial snapshot for each source (Create it if it does not exist yet)
  ansible.builtin.command:
    cmd: docker exec kopia kopia snapshot create {{ item }}
  loop:
    - /app-data
    - /nextcloud-data
    - /nextcloud-db-dump
    - /stacks
  when: item not in kopia_existing_snapshots.stdout
  changed_when: true

- name: Create group for read access to Kopia backups
  ansible.builtin.group:
    name: "{{ kopia_backup_group }}"
    state: present

- name: Create dedicated read-only backup-puller user
  ansible.builtin.user:
    name: backuppull
    system: true
    shell: /bin/sh
    groups: "{{ kopia_backup_group }}"
    append: true
    create_home: true

- name: Ensure .ssh directory exists for backuppull
  ansible.builtin.file:
    path: /home/backuppull/.ssh
    state: directory
    owner: backuppull
    group: backuppull
    mode: '0700'

- name: Authorize desktop's key, restricted via rrsync (read-only) to the backup dir
  ansible.builtin.copy:
    dest: /home/backuppull/.ssh/authorized_keys
    content: >
      command="{{ rrsync_path }} -ro {{ storage_hdd_path | default('/mnt/hdd8T') }}/backups/kopia/",restrict
      {{ desktop_ssh_pubkey }}
    owner: backuppull
    group: backuppull
    mode: '0600'

- name: Allow backuppull read access to the backup directory
  ansible.builtin.acl:
    path: "{{ storage_hdd_path | default('/mnt/hdd8T') }}/backups/kopia"
    entity: backuppull
    etype: user
    permissions: rX
    recursive: true
    state: present

# ===========================================================================
# Automatic system maintenance and security updates
# ===========================================================================
- name: Install packages for auto updates
  ansible.builtin.apt:
    name:
      - unattended-upgrades
      - update-notifier-common
      - fwupd
    state: present
    update_cache: true

- name: Enable automatic reboot for unattended-upgrades
  ansible.builtin.lineinfile:
    path: /etc/apt/apt.conf.d/50unattended-upgrades
    regexp: '^//?\s*Unattended-Upgrade::Automatic-Reboot '
    line: 'Unattended-Upgrade::Automatic-Reboot "true";'

- name: Set automatic reboot time to 04:00
  ansible.builtin.lineinfile:
    path: /etc/apt/apt.conf.d/50unattended-upgrades
    regexp: '^//?\s*Unattended-Upgrade::Automatic-Reboot-Time '
    line: 'Unattended-Upgrade::Automatic-Reboot-Time "04:00";'
