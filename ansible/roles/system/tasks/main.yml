---
# ===========================================================================
# File prep for apps and docker proxy for security of Watchtower and Autoheal
# ===========================================================================
- name: Create directories for apps
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ appdata_path }}/crowdsec/config"
    - "{{ appdata_path }}/crowdsec/data"
    - "{{ appdata_path }}/kopia/config"
    - "{{ appdata_path }}/kopia/cache"
    - "/opt/docker/compose-stacks"

- name: Ensure monitoring network exists
  community.docker.docker_network:
    name: monitoring
    state: present

- name: Deploy Docker Socket Proxy container
  community.docker.docker_container:
    name: docker-proxy
    image: tecnativa/docker-socket-proxy:latest
    state: started
    restart_policy: unless-stopped
    env:
      POST: "0"
      BUILD: "0"
      EXEC: "0"
      DELETE: "0"
      CONTAINERS: "1"
      IMAGES: "1"
      INFO: "1"
      NETWORKS: "1"
      SERVICES: "1"
      TASKS: "1"
      VOLUMES: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - name: monitoring

# ===========================================================================
# CROWDSEC - Digital bouncer
# ===========================================================================
- name: Deploy Crowdsec container
  community.docker.docker_container:
    name: crowdsec
    image: crowdsecurity/crowdsec:latest
    state: started
    restart_policy: unless-stopped
    env:
      COLLECTIONS: "crowdsecurity/nginx crowdsecurity/http-cve"
    volumes:
      - "{{ appdata_path }}/crowdsec/config:/etc/crowdsec"
      - "{{ appdata_path }}/crowdsec/data:/var/lib/crowdsec/data"
      - /var/log:/var/log:ro
      - "{{ appdata_path }}/npm/logs:/logs/npm:ro"

# ===========================================================================
# WATCHTOWER - Auto update of containers
# ===========================================================================
- name: Deploy Watchtower container
  community.docker.docker_container:
    name: watchtower
    image: containrrr/watchtower:latest
    state: started
    restart_policy: unless-stopped
    env:
      DOCKER_HOST: "tcp://docker-proxy:2375"
      WATCHTOWER_CLEANUP: "true"
      DOCKER_API_VERSION: "1.52"
      WATCHTOWER_STARTUP_DELAY: "0"
      TZ: "{{ timezone }}"
    networks:
      - name: monitoring

# ===========================================================================
# Automatic system maintenance and security updates
# ===========================================================================
- name: Install packages for auto updates
  ansible.builtin.apt:
    name:
      - unattended-upgrades
      - update-notifier-common
      - fwupd
    state: present
    update_cache: true

- name: Enable automatic reboot for unattended-upgrades
  ansible.builtin.lineinfile:
    path: /etc/apt/apt.conf.d/50unattended-upgrades
    regexp: '^//?\s*Unattended-Upgrade::Automatic-Reboot '
    line: 'Unattended-Upgrade::Automatic-Reboot "true";'

- name: Set automatic reboot time to 04:00
  ansible.builtin.lineinfile:
    path: /etc/apt/apt.conf.d/50unattended-upgrades
    regexp: '^//?\s*Unattended-Upgrade::Automatic-Reboot-Time '
    line: 'Unattended-Upgrade::Automatic-Reboot-Time "04:00";'
