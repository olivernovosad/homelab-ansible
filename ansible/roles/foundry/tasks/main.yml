---
# ===========================================================================
# 1. PRÍPRAVA ADRESÁRA A DOCKER SIETE
# ===========================================================================
- name: Vytvor adresár pre dáta Foundry VTT
  ansible.builtin.file:
    path: "{{ appdata_path }}/vttfoundry"
    state: directory
    owner: "1000"
    group: "1000"
    mode: '0755'

- name: Uisti sa, že Docker sieť tunnel_net existuje
  community.docker.docker_network:
    name: tunnel_net
    state: present

# ===========================================================================
# 2. VIRTUAL TABLETOP - Foundry VTT
# ===========================================================================
- name: Spusti Foundry VTT kontajner
  community.docker.docker_container:
    name: foundry_vtt
    image: ghcr.io/felddy/foundryvtt:13
    hostname: vttfoundry
    state: started
    restart_policy: always
    init: true
    volumes:
      - "{{ appdata_path }}/vttfoundry:/data"
    env:
      FOUNDRY_USERNAME: "{{ vault_foundry_username }}"
      FOUNDRY_PASSWORD: "{{ vault_foundry_password }}"
      FOUNDRY_ADMIN_KEY: "{{ vault_foundry_admin_key }}"
      FOUNDRY_TELEMETRY: "true"
      FOUNDRY_PROXY_SSL: "true"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:30000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      autoheal: "true"
      com.centurylinklabs.watchtower.enable: "false"
    networks:
      - name: tunnel_net

# ===========================================================================
# 3. AUTOHEAL - Automatický reštart pri zamrznutí
# ===========================================================================
- name: Spusti Autoheal kontajner
  community.docker.docker_container:
    name: autoheal
    image: willfarrell/autoheal:latest
    state: started
    restart_policy: always
    init: true
    env:
      AUTOHEAL_CONTAINER_LABEL: "autoheal"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

# ===========================================================================
# 4. D&D BEYOND PROXY
# ===========================================================================
- name: Spusti D&D Beyond Proxy kontajner
  community.docker.docker_container:
    name: ddb-proxy
    image: ghcr.io/mrprimate/ddb-proxy:latest
    state: started
    restart_policy: always
    init: true
    published_ports:
      - "127.0.0.1:3000:3000"
    networks:
      - name: tunnel_net
