---
- name: "Create Nextcloud directory structure"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "33"
    group: "33"
    mode: '0755'
  loop:
    - "{{ nextcloud_dir }}"
    - "{{ nextcloud_dir }}/config"

- name: "Create Nextcloud directory for DB dumps"
  ansible.builtin.file:
    path: "{{ nextcloud_db_dump_dir }}"
    state: directory
    owner: "33"
    group: "33"
    mode: '0700'

- name: "Deployment of cron job for night pgdump (before Kopia run at 2:00)"
  ansible.builtin.cron:
    name: "Nextcloud DB dump pre zálohu"
    minute: "45"
    hour: "1"
    user: root
    job: >
      docker exec nextcloud-db pg_dump -U {{ nextcloud_db_user }} {{ nextcloud_db_name }}
      | gzip > {{ nextcloud_db_dump_dir }}/nextcloud-db-$(date +\%Y\%m\%d).sql.gz
      && find {{ nextcloud_db_dump_dir }} -name '*.sql.gz' -mtime +7 -delete

- name: Create .env file for Docker Compose credentials
  ansible.builtin.template:
    src: env.j2
    dest: "{{ nextcloud_dir }}/nextcloud.env"
    mode: '0600'

- name: "Generate custom Nextcloud PHP configuration"
  ansible.builtin.template:
    src: zzz-custom.config.php.j2
    dest: "{{ nextcloud_dir }}/config/zzz-custom.config.php"
    owner: "33"
    group: "33"
    mode: '0644'

- name: "Generate docker-compose.yml from template"
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ nextcloud_dir }}/docker-compose.yml"
    mode: '0644'

- name: "Start Nextcloud stack via Docker Compose"
  community.docker.docker_compose_v2:
    project_src: "{{ nextcloud_dir }}"
    state: present

- name: "Wait for Nextcloud container to finish initializing"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ nextcloud_apache_port }}/status.php"
    status_code: 200
  register: nextcloud_status
  until: nextcloud_status.status == 200
  retries: 30
  delay: 10

- name: "Configuration of Collabora Office (Richdocuments)"
  when: nextcloud_enable_collabora | bool
  block:
    - name: Get list of installed apps in JSON format
      ansible.builtin.command:
        cmd: "docker exec -u www-data {{ nextcloud_container_name }} php occ app:list --output=json"
      register: nextcloud_apps_raw
      changed_when: false

    - name: Enable richdocuments app (if not already enabled)
      ansible.builtin.command:
        cmd: "docker exec -u www-data {{ nextcloud_container_name }} php occ app:enable richdocuments"
      when: "'richdocuments' not in (nextcloud_apps_raw.stdout | from_json).enabled"
      # This changes stat in Nextcloud, meaning changed_when needs to be se to true,
      # because this task will be only run if app was not allowed:
      changed_when: true

    - name: Check the currently configured WOPI URL for Collabora
      ansible.builtin.command:
        cmd: "docker exec -u www-data {{ nextcloud_container_name }} php occ config:app:get richdocuments wopi_url"
      register: nextcloud_wopi_url
      changed_when: false
      failed_when: false

    - name: Set WOPI URL for Collabora
      ansible.builtin.command:
        cmd: "docker exec -u www-data {{ nextcloud_container_name }} php occ config:app:set richdocuments wopi_url --value='{{ nextcloud_collabora_url }}'"
      when: nextcloud_wopi_url.stdout | trim != nextcloud_collabora_url
      changed_when: true

- name: "Deployment of fixes and migration of mimetype database (Manual maintanance)"
  ansible.builtin.command:
    cmd: "docker exec -u www-data {{ nextcloud_container_name }} php occ maintenance:repair --include-expensive"
  when: nextcloud_run_repair | bool
  changed_when: true
  tags:
    - never
    - repair
