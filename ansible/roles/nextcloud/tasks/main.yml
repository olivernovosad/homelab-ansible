---
- name: "Vytvor adresárovú štruktúru pre Nextcloud"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "33"
    group: "33"
    mode: '0755'
  loop:
    - "{{ nextcloud_dir }}"
    - "{{ nextcloud_dir }}/config"

- name: Create .env file for Docker Compose credentials
  ansible.builtin.template:
    src: env.j2
    dest: "{{ nextcloud_dir }}/nextcloud.env"
    mode: '0600'

- name: "Vygeneruj custom PHP konfiguráciu Nextcloudu"
  ansible.builtin.template:
    src: zzz-custom.config.php.j2
    dest: "{{ nextcloud_dir }}/config/zzz-custom.config.php"
    owner: "33"
    group: "33"
    mode: '0644'

- name: "Vygeneruj docker-compose.yml zo šablóny"
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ nextcloud_dir }}/docker-compose.yml"
    mode: '0644'

- name: "Spusti Nextcloud Stack cez Docker Compose"
  community.docker.docker_compose_v2:
    project_src: "{{ nextcloud_dir }}"
    state: present

- name: "Počkaj, kým Nextcloud Container dokončí inicializáciu"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ nextcloud_apache_port }}/status.php"
    status_code: 200
  register: nc_status
  until: nc_status.status == 200
  retries: 30
  delay: 10

- name: "Konfigurácia Collabora Office (Richdocuments)"
  when: nextcloud_enable_collabora | bool
  block:
    - name: Získaj zoznam nainštalovaných aplikácií v JSON formáte
      ansible.builtin.command:
        cmd: "docker exec -u www-data {{ nextcloud_container_name }} php occ app:list --output=json"
      register: nc_apps_raw
      changed_when: false

    - name: Povol aplikáciu richdocuments (ak nie je aktivovaná)
      ansible.builtin.command:
        cmd: "docker exec -u www-data {{ nextcloud_container_name }} php occ app:enable richdocuments"
      when: "'richdocuments' not in (nc_apps_raw.stdout | from_json).enabled"

    - name: Skontroluj aktuálne nastavenú WOPI URL pre Collabora
      ansible.builtin.command:
        cmd: "docker exec -u www-data {{ nextcloud_container_name }} php occ config:app:get richdocuments wopi_url"
      register: nc_wopi_url
      changed_when: false
      failed_when: false

    - name: Nastav WOPI URL pre Collabora
      ansible.builtin.command:
        cmd: "docker exec -u www-data {{ nextcloud_container_name }} php occ config:app:set richdocuments wopi_url --value='{{ nextcloud_collabora_url }}'"
      when: nc_wopi_url.stdout | trim != nextcloud_collabora_url

- name: "Spustenie opravy a migrácie mimetype databázy (Manuálna údržba)"
  ansible.builtin.command:
    cmd: "docker exec -u www-data {{ nextcloud_container_name }} php occ maintenance:repair --include-expensive"
  when: nextcloud_run_repair | bool
  tags:
    - never
    - repair
