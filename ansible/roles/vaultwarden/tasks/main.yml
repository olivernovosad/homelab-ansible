---
# ===========================================================================
# 1. DATA DIRECTORY & DOCKER NETWORK
# ===========================================================================
- name: Create Vaultwarden data directory
  ansible.builtin.file:
    path: "{{ appdata_path }}/vaultwarden"
    state: directory
    mode: '0755'

- name: Ensure tunnel_net Docker network exists
  community.docker.docker_network:
    name: tunnel_net
    state: present

# ===========================================================================
# 2. PASSWORD MANAGER - Vaultwarden
# ===========================================================================
- name: Start Vaultwarden container
  community.docker.docker_container:
    name: vaultwarden
    image: vaultwarden/server:latest
    state: started
    restart_policy: unless-stopped
    init: true
    published_ports:
      - "127.0.0.1:8880:80"
    env:
      WEBSOCKET_ENABLED: "true"
      SIGNUPS_ALLOWED: "false"
    volumes:
      - "{{ appdata_path }}/vaultwarden:/data"
    networks:
      - name: tunnel_net
