---
# ===========================================================================
# 1. Directory prep and docker network prep
# ===========================================================================
- name: Create necessary directories for media stack
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: '0755'
  loop:
    - "{{ appdata_path }}/gluetun"
    - "{{ appdata_path }}/qbittorrent"
    - "{{ appdata_path }}/prowlarr"
    - "{{ appdata_path }}/radarr"
    - "{{ appdata_path }}/sonarr"
    - "{{ appdata_path }}/lidarr"
    - "{{ appdata_path }}/mylar3"
    - "{{ appdata_path }}/bazarr"
    - "{{ appdata_path }}/jellyfin"
    - "{{ appdata_path }}/jellyfin/cache"
    - "{{ appdata_path }}/jellyseerr"
    - "{{ appdata_path }}/notifiarr"
    - "{{ storage_hdd_path | default('/mnt/hdd8T') }}/data/torrents"
    - "{{ storage_hdd_path | default('/mnt/hdd8T') }}/data/media"

- name: Ensure Docker networks exist
  community.docker.docker_network:
    name: "{{ item }}"
    state: present
  loop:
    - proxy_net
    - media_net
    - torrent_net
# Check if there are GPU on device
- name: Check GPU availability for Jellyfin
  ansible.builtin.stat:
    path: /dev/dri/renderD128
  register: media_gpu_device

# ===========================================================================
# 2. VPN LAYER - Gluetun
# ===========================================================================
- name: Deploy Gluetun VPN container
  community.docker.docker_container:
    name: gluetun
    image: qmcgaw/gluetun:latest
    state: started
    restart_policy: unless-stopped
    init: true
    capabilities:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    published_ports:
      - "127.0.0.1:8080:8080" # qBittorrent Web UI
    env:
      VPN_SERVICE_PROVIDER: "mullvad"
      VPN_TYPE: "wireguard"
      WIREGUARD_PRIVATE_KEY: "{{ vault_wireguard_private_key }}"
      WIREGUARD_ADDRESSES: "{{ vault_wireguard_addresses }}"
      SERVER_COUNTRIES: "{{ vault_server_countries }}"
      TZ: "{{ timezone }}"
    volumes:
      - "{{ appdata_path }}/gluetun:/gluetun"
    healthcheck:
      # Asking local gluetun API inside of container
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9999 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - name: torrent_net

# ===========================================================================
# 3. DOWNLOAD LAYER - qBittorrent
# ===========================================================================
- name: Deploy qBittorrent container (routed through Gluetun VPN)
  community.docker.docker_container:
    name: qbittorrent
    image: lscr.io/linuxserver/qbittorrent:latest
    state: started
    restart_policy: unless-stopped
    network_mode: "container:gluetun"
    env:
      PUID: "1000"
      PGID: "1000"
      TZ: "{{ timezone }}"
      WEBUI_PORT: "8080"
    volumes:
      - "{{ appdata_path }}/qbittorrent:/config"
      - "{{ storage_hdd_path | default('/mnt/hdd8T') }}/data:/data"
# ===========================================================================
# 4. INDEXER & BYPASS - Prowlarr & FlareSolverr
# ===========================================================================
- name: Deploy Prowlarr container
  community.docker.docker_container:
    name: prowlarr
    image: lscr.io/linuxserver/prowlarr:latest
    state: started
    restart_policy: unless-stopped
    published_ports:
      - "127.0.0.1:9696:9696"
    env:
      PUID: "1000"
      PGID: "1000"
      TZ: "{{ timezone }}"
    volumes:
      - "{{ appdata_path }}/prowlarr:/config"
    networks:
      - name: media_net
      - name: torrent_net

- name: Deploy Flaresolverr container
  community.docker.docker_container:
    name: flaresolverr
    image: ghcr.io/flaresolverr/flaresolverr:latest
    state: started
    restart_policy: unless-stopped
    init: true
    published_ports:
      - "127.0.0.1:8191:8191"
    env:
      LOG_LEVEL: "info"
      TZ: "{{ timezone }}"
    networks:
      - name: torrent_net

# ===========================================================================
# 5. MEDIA MANAGERS (Radarr, Sonarr, Lidarr, Mylar3, Bazarr)
# ===========================================================================
- name: Deploy Radarr container
  community.docker.docker_container:
    name: radarr
    image: lscr.io/linuxserver/radarr:latest
    state: started
    restart_policy: unless-stopped
    published_ports:
      - "127.0.0.1:7878:7878"
    env:
      PUID: "1000"
      PGID: "1000"
      TZ: "{{ timezone }}"
    volumes:
      - "{{ appdata_path }}/radarr:/config"
      - "{{ storage_hdd_path | default('/mnt/hdd8T') }}/data:/data"
    networks:
      - name: media_net
      - name: torrent_net

- name: Deploy Sonarr container
  community.docker.docker_container:
    name: sonarr
    image: lscr.io/linuxserver/sonarr:latest
    state: started
    restart_policy: unless-stopped
    published_ports:
      - "127.0.0.1:8989:8989"
    env:
      PUID: "1000"
      PGID: "1000"
      TZ: "{{ timezone }}"
    volumes:
      - "{{ appdata_path }}/sonarr:/config"
      - "{{ storage_hdd_path | default('/mnt/hdd8T') }}/data:/data"
    networks:
      - name: media_net
      - name: torrent_net

- name: Deploy Lidarr container
  community.docker.docker_container:
    name: lidarr
    image: lscr.io/linuxserver/lidarr:latest
    state: started
    restart_policy: unless-stopped
    published_ports:
      - "127.0.0.1:8686:8686"
    env:
      PUID: "1000"
      PGID: "1000"
      TZ: "{{ timezone }}"
    volumes:
      - "{{ appdata_path }}/lidarr:/config"
      - "{{ storage_hdd_path | default('/mnt/hdd8T') }}/data:/data"
    networks:
      - name: media_net
      - name: torrent_net

- name: Deploy MyLar3 container
  community.docker.docker_container:
    name: mylar3
    image: lscr.io/linuxserver/mylar3:latest
    state: started
    restart_policy: unless-stopped
    published_ports:
      - "127.0.0.1:8090:8090"
    env:
      PUID: "1000"
      PGID: "1000"
      TZ: "{{ timezone }}"
    volumes:
      - "{{ appdata_path }}/mylar3:/config"
      - "{{ storage_hdd_path | default('/mnt/hdd8T') }}/data:/data"
    networks:
      - name: media_net
      - name: torrent_net

- name: Deploy Bazarr container
  community.docker.docker_container:
    name: bazarr
    image: lscr.io/linuxserver/bazarr:latest
    state: started
    restart_policy: unless-stopped
    published_ports:
      - "127.0.0.1:6767:6767"
    env:
      PUID: "1000"
      PGID: "1000"
      TZ: "{{ timezone }}"
    volumes:
      - "{{ appdata_path }}/bazarr:/config"
      - "{{ storage_hdd_path | default('/mnt/hdd8T') }}/data/media:/data/media"
    networks:
      - name: media_net

# ===========================================================================
# 6. MEDIA SERVER - Jellyfin
# ===========================================================================
- name: Deploy Jellyfin Media server container
  community.docker.docker_container:
    name: jellyfin
    image: jellyfin/jellyfin:latest
    user: "1000:1000"
    groups: "{{ [media_gpu_device.stat.gid | string] if media_gpu_device.stat.exists else omit }}"
    state: started
    restart_policy: unless-stopped
    init: true
    env:
      TZ: "{{ timezone }}"
    published_ports:
      - "127.0.0.1:8096:8096"
      - "127.0.0.1:8920:8920"
      - "7359:7359/udp"
      - "1900:1900/udp"
    volumes:
      - "{{ appdata_path }}/jellyfin:/config"
      - "{{ appdata_path }}/jellyfin/cache:/cache"
      - "{{ storage_hdd_path | default('/mnt/hdd8T') }}/data:/data:ro"
    devices: "{{ ['/dev/dri:/dev/dri'] if media_gpu_device.stat.exists else omit }}"
    networks:
      - name: proxy_net
      - name: media_net

# ===========================================================================
# 7. REQUESTS & NOTIFICATIONS (Jellyseerr & Notifiarr)
# ===========================================================================
- name: Deploy Jellyseerr container
  community.docker.docker_container:
    name: jellyseerr
    image: fallenbagel/jellyseerr:latest
    state: started
    restart_policy: unless-stopped
    init: true
    published_ports:
      - "127.0.0.1:5055:5055"
    env:
      TZ: "{{ timezone }}"
    volumes:
      - "{{ appdata_path }}/jellyseerr:/app/config"
    networks:
      - name: proxy_net
      - name: media_net

- name: Deploy Notifiarr container
  community.docker.docker_container:
    name: notifiarr
    image: golift/notifiarr:latest
    hostname: media-server
    state: started
    restart_policy: unless-stopped
    init: true
    published_ports:
      - "127.0.0.1:5454:5454"
    env:
      TZ: "{{ timezone }}"
    volumes:
      - "{{ appdata_path }}/notifiarr:/config"
      - /var/run/utmp:/var/run/utmp:ro
    networks:
      - name: media_net
