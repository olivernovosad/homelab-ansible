---
system_update_reboot_if_needed: false
base_docker_path: "/opt/docker"
appdata_path: "{{ base_docker_path }}/app-data"
# Global settings
timezone: "Europe/Bratislava"
# Movie/series paths on disk will be defined here later
# media_movies_path: "/mnt/storage/movies"
# Network settings
lan_subnet: "192.168.0.0/24"
docker_subnet: "172.16.0.0/12"
# Node-exporter textfile collector dir. Written to by backup/kopia-snapshot.sh and restore_verify,
# read by the monitoring role's node-exporter container.
kopia_textfile_metrics_dir: "{{ appdata_path }}/node-exporter/textfile"
# System packages for bootstrap
base_packages:
  - qemu-guest-agent
  - ufw
  - curl
  - git
  - htop
  - iotop
  - ca-certificates
  - gnupg
  - acl
# Storage path management
storage_ssd_path: "/mnt/ssd"
storage_hdd_path: "/mnt/hdd8T"
nextcloud_domain: "{{ vault_nextcloud_domain }}"
