---
# ===========================================================================
# 1. PRÍPRAVA ADRESÁROV NA DISKU A DOCKER SIETÍ
# ===========================================================================
- name: Vytvor potrebné adresáre pre media stack
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /opt/docker/app-data/gluetun
    - /opt/docker/app-data/qbittorrent
    - /opt/docker/app-data/prowlarr
    - /opt/docker/app-data/radarr
    - /opt/docker/app-data/sonarr
    - /opt/docker/app-data/lidarr
    - /opt/docker/app-data/mylar3
    - /opt/docker/app-data/bazarr
    - /opt/docker/app-data/jellyfin
    - /opt/docker/app-data/jellyfin/cache
    - /opt/docker/app-data/jellyseerr
    - /opt/docker/app-data/notifiarr
    - /mnt/hdd8T/data/torrents
    - /mnt/hdd8T/data/media

- name: Uisti sa, že Docker siete existujú
  community.docker.docker_network:
    name: "{{ item }}"
    state: present
  loop:
    - proxy_net
    - media_net
    - torrent_net

# ===========================================================================
# 2. VPN LAYER - Gluetun
# ===========================================================================
- name: Spusti Gluetun VPN kontajner
  community.docker.docker_container:
    name: gluetun
    image: qmcgaw/gluetun:latest
    state: started
    restart_policy: unless-stopped
    init: true
    capabilities:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    published_ports:
      - "127.0.0.1:8080:8080" # qBittorrent Web UI
    env:
      VPN_SERVICE_PROVIDER: "mullvad"
      VPN_TYPE: "wireguard"
      WIREGUARD_PRIVATE_KEY: "{{ vault_wireguard_private_key }}"
      WIREGUARD_ADDRESSES: "{{ vault_wireguard_addresses }}"
      SERVER_COUNTRIES: "{{ vault_server_countries }}"
      TZ: "{{ timezone }}"
    volumes:
      - /opt/docker/app-data/gluetun:/gluetun
    healthcheck:
      test: ["CMD-SHELL", "if [ \"$(wget -qO- http://ifconfig.me)\" = \"{{ vault_home_public_ip }}\" ]; then exit 1; else exit 0; fi"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - name: torrent_net

# ===========================================================================
# 3. DOWNLOAD LAYER - qBittorrent
# ===========================================================================
- name: Spusti qBittorrent kontajner (smerovaný cez Gluetun VPN)
  community.docker.docker_container:
    name: qbittorrent
    image: lscr.io/linuxserver/qbittorrent:latest
    state: started
    restart_policy: unless-stopped
    network_mode: "container:gluetun"
    env:
      PUID: "1000"
      PGID: "1000"
      TZ: "{{ timezone }}"
      WEBUI_PORT: "8080"
    volumes:
      - /opt/docker/app-data/qbittorrent:/config
      - /mnt/hdd8T/data/torrents:/data/torrents

# ===========================================================================
# 4. INDEXER & BYPASS - Prowlarr & FlareSolverr
# ===========================================================================
- name: Spusti Prowlarr kontajner
  community.docker.docker_container:
    name: prowlarr
    image: lscr.io/linuxserver/prowlarr:latest
    state: started
    restart_policy: unless-stopped
    published_ports:
      - "127.0.0.1:9696:9696"
    env:
      PUID: "1000"
      PGID: "1000"
      TZ: "{{ timezone }}"
    volumes:
      - /opt/docker/app-data/prowlarr:/config
    networks:
      - name: media_net
      - name: torrent_net

- name: Spusti FlareSolverr kontajner
  community.docker.docker_container:
    name: flaresolverr
    image: ghcr.io/flaresolverr/flaresolverr:latest
    state: started
    restart_policy: unless-stopped
    init: true
    published_ports:
      - "127.0.0.1:8191:8191"
    env:
      LOG_LEVEL: "info"
      TZ: "{{ timezone }}"
    networks:
      - name: torrent_net

# ===========================================================================
# 5. MEDIA MANAGERS (Radarr, Sonarr, Lidarr, Mylar3, Bazarr)
# ===========================================================================
- name: Spusti Radarr kontajner
  community.docker.docker_container:
    name: radarr
    image: lscr.io/linuxserver/radarr:latest
    state: started
    restart_policy: unless-stopped
    published_ports:
      - "127.0.0.1:7878:7878"
    env:
      PUID: "1000"
      PGID: "1000"
      TZ: "{{ timezone }}"
    volumes:
      - /opt/docker/app-data/radarr:/config
      - /mnt/hdd8T/data:/data
    networks:
      - name: media_net
      - name: torrent_net

- name: Spusti Sonarr kontajner
  community.docker.docker_container:
    name: sonarr
    image: lscr.io/linuxserver/sonarr:latest
    state: started
    restart_policy: unless-stopped
    published_ports:
      - "127.0.0.1:8989:8989"
    env:
      PUID: "1000"
      PGID: "1000"
      TZ: "{{ timezone }}"
    volumes:
      - /opt/docker/app-data/sonarr:/config
      - /mnt/hdd8T/data:/data
    networks:
      - name: media_net
      - name: torrent_net

- name: Spusti Lidarr kontajner
  community.docker.docker_container:
    name: lidarr
    image: lscr.io/linuxserver/lidarr:latest
    state: started
    restart_policy: unless-stopped
    published_ports:
      - "127.0.0.1:8686:8686"
    env:
      PUID: "1000"
      PGID: "1000"
      TZ: "{{ timezone }}"
    volumes:
      - /opt/docker/app-data/lidarr:/config
      - /mnt/hdd8T/data:/data
    networks:
      - name: media_net
      - name: torrent_net

- name: Spusti Mylar3 kontajner
  community.docker.docker_container:
    name: mylar3
    image: lscr.io/linuxserver/mylar3:latest
    state: started
    restart_policy: unless-stopped
    published_ports:
      - "127.0.0.1:8090:8090"
    env:
      PUID: "1000"
      PGID: "1000"
      TZ: "{{ timezone }}"
    volumes:
      - /opt/docker/app-data/mylar3:/config
      - /mnt/hdd8T/data:/data
    networks:
      - name: media_net
      - name: torrent_net

- name: Spusti Bazarr kontajner
  community.docker.docker_container:
    name: bazarr
    image: lscr.io/linuxserver/bazarr:latest
    state: started
    restart_policy: unless-stopped
    published_ports:
      - "127.0.0.1:6767:6767"
    env:
      PUID: "1000"
      PGID: "1000"
      TZ: "{{ timezone }}"
    volumes:
      - /opt/docker/app-data/bazarr:/config
      - /mnt/hdd8T/data/media:/data/media
    networks:
      - name: media_net

# ===========================================================================
# 6. MEDIA SERVER - Jellyfin
# ===========================================================================
- name: Spusti Jellyfin Media Server kontajner
  community.docker.docker_container:
    name: jellyfin
    image: jellyfin/jellyfin:latest
    user: "1000:1000"
    state: started
    restart_policy: unless-stopped
    init: true
    env:
      TZ: "{{ timezone }}"
    published_ports:
      - "127.0.0.1:8096:8096"
      - "127.0.0.1:8920:8920"
      - "7359:7359/udp"
      - "1900:1900/udp"
    volumes:
      - /opt/docker/app-data/jellyfin:/config
      - /opt/docker/app-data/jellyfin/cache:/cache
      - /mnt/hdd8T/data:/data:ro
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
      - /dev/dri/card1:/dev/dri/card1
    groups:
      - "991"
      - "44"
    networks:
      - name: proxy_net
      - name: media_net

# ===========================================================================
# 7. REQUESTS & NOTIFICATIONS (Jellyseerr & Notifiarr)
# ===========================================================================
- name: Spusti Jellyseerr kontajner
  community.docker.docker_container:
    name: jellyseerr
    image: fallenbagel/jellyseerr:latest
    state: started
    restart_policy: unless-stopped
    init: true
    published_ports:
      - "127.0.0.1:5055:5055"
    env:
      TZ: "{{ timezone }}"
    volumes:
      - /opt/docker/app-data/jellyseerr:/app/config
    networks:
      - name: proxy_net
      - name: media_net

- name: Spusti Notifiarr kontajner
  community.docker.docker_container:
    name: notifiarr
    image: golift/notifiarr:latest
    hostname: media-server
    state: started
    restart_policy: unless-stopped
    init: true
    published_ports:
      - "127.0.0.1:5454:5454"
    env:
      TZ: "{{ timezone }}"
    volumes:
      - /opt/docker/app-data/notifiarr:/config
      - /var/run/utmp:/var/run/utmp:ro
    networks:
      - name: media_net
